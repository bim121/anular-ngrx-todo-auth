<form (ngSubmit)="onSubmit()" class="add-todo-form">
  <app-input
    inputId="new-task"
    name="newTask"
    placeholder="What needs to be done?"
    [(ngModel)]="task"
    [disabled]="disabled()"
  />
  <button
    app-button
    type="submit"
    [disabled]="disabled() || !task.trim()"
  >
    Add Task
  </button>
</form>
