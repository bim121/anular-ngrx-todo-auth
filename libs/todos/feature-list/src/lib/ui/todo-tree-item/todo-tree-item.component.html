<li
  [class.completed]="node().completed"
  [style.--tree-depth]="depth()"
  class="todo-tree-item"
>
  @if (editingId() !== node().id) {
    <app-todo-item
      [todo]="node()"
      [disabled]="loading() || isTogglePending()(node().id)"
      [comments]="commentsFor()(node().id)"
      [commentsOpen]="commentsOpenId() === node().id"
      [searchQuery]="searchQuery()"
      (toggled)="onToggle(node().id)"
      (commentsOpened)="commentsOpened.emit(node().id)"
    >
      <button
        app-button
        type="button"
        variant="secondary"
        size="sm"
        (click)="onStartEdit(node())"
        [disabled]="loading() || saving()"
      >
        Edit
      </button>
      <button
        app-button
        type="button"
        variant="danger"
        size="sm"
        (click)="onDelete(node().id)"
        [disabled]="loading() || saving()"
      >
        Delete
      </button>
    </app-todo-item>
  } @else {
    <div class="edit-mode">
      <app-input
        inputId="edit-task"
        name="updatedTask"
        [ngModel]="updatedTask()"
        (ngModelChange)="updatedTaskChange.emit($event)"
        (keydown.enter)="editSaved.emit()"
        (keydown.escape)="editCancelled.emit()"
        [disabled]="loading() || saving()"
      />
      <div class="actions">
        <button
          app-button
          type="button"
          size="sm"
          (click)="editSaved.emit()"
          [disabled]="loading() || saving()"
          [loading]="saving()"
        >
          Save
        </button>
        <button
          app-button
          type="button"
          variant="secondary"
          size="sm"
          (click)="editCancelled.emit()"
          [disabled]="loading() || saving()"
        >
          Cancel
        </button>
      </div>
    </div>
  }

  @if (node().children.length > 0) {
    <ul class="subtasks">
      @for (child of node().children; track child.id) {
        <app-todo-tree-item
          [node]="child"
          [depth]="depth() + 1"
          [loading]="loading()"
          [saving]="saving()"
          [editingId]="editingId()"
          [updatedTask]="updatedTask()"
          [isTogglePending]="isTogglePending()"
          [commentsFor]="commentsFor()"
          [commentsLoadingFor]="commentsLoadingFor()"
          [commentsOpenId]="commentsOpenId()"
          [searchQuery]="searchQuery()"
          (toggled)="toggled.emit($event)"
          (editStarted)="editStarted.emit($event)"
          (deleted)="deleted.emit($event)"
          (editSaved)="editSaved.emit()"
          (editCancelled)="editCancelled.emit()"
          (updatedTaskChange)="updatedTaskChange.emit($event)"
          (commentsOpened)="commentsOpened.emit($event)"
          (commentSubmitted)="commentSubmitted.emit($event)"
        />
      }
    </ul>
  }
</li>
