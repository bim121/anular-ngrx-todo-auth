<div class="filter-bar" role="group" aria-label="Filter tasks">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="filter-btn"
      [class.active]="filter() === option.value"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
