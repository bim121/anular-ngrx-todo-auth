<div class="todo-item-root">
  <div class="view-mode">
    <app-checkbox
      class="todo-checkbox"
      [ngModel]="todo().completed"
      (ngModelChange)="onToggle()"
      [disabled]="disabled()"
    >
      <span class="visually-hidden">{{ todo().task }}</span>
    </app-checkbox>
    <button
      app-button
      type="button"
      variant="ghost"
      size="sm"
      (click)="onToggle()"
      class="todo-task"
      [class.priority-high]="todo().priority === 'high'"
      [class.priority-low]="todo().priority === 'low'"
      [disabled]="disabled()"
    >
      @for (part of highlightParts(todo().task, searchQuery()); track $index) {
        @if (part.match) {
          <mark class="search-hit">{{ part.text }}</mark>
        } @else {
          <span>{{ part.text }}</span>
        }
      }
    </button>
    @if (todo().tags.length > 0) {
      <div class="todo-tags" aria-label="Tags">
        @for (tag of todo().tags; track tag) {
          <span class="tag-chip">{{ tag }}</span>
        }
      </div>
    }
    <span class="priority-badge" [attr.data-priority]="todo().priority">
      {{ todo().priority }}
    </span>
    <button
      app-button
      type="button"
      variant="ghost"
      size="sm"
      class="comments-toggle"
      [class.active]="commentsOpen()"
      (click)="toggleComments()"
      [attr.aria-expanded]="commentsOpen()"
    >
      Comments
      @if (comments().length > 0) {
        <span class="comments-count">({{ comments().length }})</span>
      }
    </button>
    <div class="actions">
      <ng-content />
    </div>
  </div>
</div>
